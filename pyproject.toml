[project]
name = "localrag"
version = "0.1.0"
description = "Doc-name/doc-group aware RAG pipeline with a local MCP server for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
